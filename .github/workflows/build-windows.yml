name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up builds by caching dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "index.html;." app.py

      - name: Zip Build Output
        run: |
          Compress-Archive -Path "dist/app/*" -DestinationPath "dist/LA-County-3D-Topo-Windows.zip"

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LA-County-3D-Topo-Windows
          path: dist/LA-County-3D-Topo-Windows.zip
          retention-days: 14